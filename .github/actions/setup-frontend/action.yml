name: Preparar o frontend
description: Configura Node.js e instala as dependências do frontend.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: frontend/package-lock.json
    - name: Instala as dependências do frontend
      run: npm ci --ignore-scripts
      shell: bash
      working-directory: frontend
