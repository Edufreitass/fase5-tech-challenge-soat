name: Testes E2E e de carga (manual)

# Manual: valida o ambiente já publicado (carga, varredura de dados pessoais nos logs e
# testes de frontend com Playwright: comprador e funcionário). Gera custo na AWS.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-dev
  cancel-in-progress: false

jobs:
  api:
    name: API, carga e dados pessoais nos logs
    runs-on: ubuntu-24.04-arm
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python
        with:
          dependency-group: e2e
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      # -o addopts="" remove o --ignore de backend/tests/e2e usado no CI de PR
      - name: Executa os testes E2E e de carga
        run: pytest backend/tests/e2e -m e2e -o addopts="" -p no:cacheprovider
      - name: Guarda os resultados
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: resultados-e2e-api
          path: build/evidencias
          if-no-files-found: ignore

  frontend:
    name: Frontend (Playwright)
    runs-on: ubuntu-24.04-arm
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-frontend
      - name: Instala o Chromium (Playwright)
        run: npx playwright install --with-deps chromium
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Descobre a URL do site publicado
        run: |
          consulta="DistributionList.Items[?contains(Comment, 'revenda')].DomainName | [0]"
          dominio=$(aws cloudfront list-distributions --query "$consulta" --output text)
          echo "E2E_URL=https://$dominio" >> "$GITHUB_ENV"
      - name: Executa os testes no navegador
        run: npm run e2e
      - name: Guarda os resultados
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: resultados-e2e-frontend
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore
