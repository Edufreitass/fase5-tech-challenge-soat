[project]
name = "revenda"
version = "0.1.0"
description = "Monorepo da plataforma de revenda de veículos: API serverless, frontend e infraestrutura AWS"
readme = "README.md"
requires-python = ">=3.13,<3.14"

[dependency-groups]
runtime = [
    "aws-lambda-powertools[tracer,validation]>=3.0",
    "pydantic>=2.9",
    "pynacl>=1.5",
    "pyyaml>=6.0",
    "httpx>=0.27",
]
aws-sdk = ["boto3>=1.35"]

dev = [
    {include-group = "runtime"},
    {include-group = "aws-sdk"},
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "hypothesis>=6.112",
    "time-machine>=2.15",
    "moto[dynamodb,ssm,cognitoidp,sns,sqs,logs]>=5.0",
    "jsonschema>=4.23",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pyyaml",
    "types-jsonschema",
    "boto3-stubs[essential]",
    "import-linter>=2.1",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
e2e = [
    {include-group = "dev"},
    "locust>=2.32",
]

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["docs"]  # scripts de geracao dos PDFs nao fazem parte da aplicacao
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "PL", "RUF"]
ignore = ["E501"]  # o formatador cuida do tamanho; blocos `fmt: skip` alinham dicionarios

[tool.ruff.lint.per-file-ignores]
"backend/src/**/adapters/dynamodb/*.py" = ["E501"]
"backend/src/**/adapters/api/handler.py" = ["PLR0913", "PLR0917"]  # muitos query params nas rotas
"backend/tests/**" = ["S101", "PLR2004", "S105", "S106", "RUF028", "PLC0415", "F811", "PLR0913", "PLR0917", "RUF059"]

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "backend/src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["locust", "locust.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
markers = ["e2e: roda contra o ambiente dev (workflow e2e.yml)"]
pythonpath = ["backend/src"]
testpaths = ["backend/tests"]
addopts = "--strict-markers -ra --ignore=backend/tests/e2e --ignore=backend/tests/load"  # e2e/carga rodam no workflow e2e.yml

[tool.coverage.run]
branch = true
source = ["backend/src"]

[tool.coverage.report]
fail_under = 80
include = ["backend/src/*/domain/*", "backend/src/*/application/*", "backend/src/shared/*"]

[tool.importlinter]
root_packages = ["shared", "admin", "migration_runner", "api_docs", "vehicles", "customers", "sales", "payments", "stubs", "audit"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Dominio e aplicacao nao dependem de boto3"
type = "forbidden"
source_modules = [
    "admin.domain", "admin.application", "migration_runner.domain", "migration_runner.application",
    "vehicles.domain", "vehicles.application", "customers.domain", "customers.application",
    "sales.domain", "sales.application", "payments.domain", "payments.application",
    "stubs.mock_gateway.application",
]
forbidden_modules = ["boto3", "botocore"]
